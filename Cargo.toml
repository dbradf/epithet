[package]
name = "epithet"
version = "0.1.3"
edition = "2021"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
dirs = "6.0.0"
serde = { version = "1.0.219", features = ["derive"] }
shellexpand = "3.1.1"
toml = "0.9.5"

[profile.release]
opt-level = 3
strip = "debuginfo"
lto = "thin"

[dev-dependencies]
rstest = "0.26.1"
